# On a v* tag: run the plugins.qgis.org gates + tests, build the zip via scripts/build_plugin.sh,
# and cut a GitHub Release with the zip attached and notes from docs/CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  UNIT_TEST: test/

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Gates — bandit (HIGH/MEDIUM), secrets, flake8
        run: |
          uv run --no-project --with bandit bandit -r . -x ./test,./tests,./docs,./.git,./lib -ll
          uv run --no-project --with detect-secrets detect-secrets scan \
            | uv run --no-project python -c "import sys,json; r=json.load(sys.stdin).get('results',{}); print('secrets:', 'clean' if not r else list(r)); sys.exit(1 if r else 0)"
          uv run --no-project --with flake8 flake8 .

      - name: Tests (headless — conftest mocks qgis)
        run: uv run --no-project --with pytest python -m pytest ${UNIT_TEST} -q

      - name: Build upload zip
        run: bash scripts/build_plugin.sh

      - name: Release notes from docs/CHANGELOG.md
        run: |
          VER=${GITHUB_REF_NAME#v}
          awk -v hdr="## [$VER]" 'index($0,hdr)==1{f=1;next} /^## /&&f{exit} f' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See docs/CHANGELOG.md for details." > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(grep -E '^name=' metadata.txt | head -1 | cut -d= -f2- | tr -d '\r')
          gh release create "${GITHUB_REF_NAME}" --title "${NAME} ${GITHUB_REF_NAME}" --notes-file notes.md *.zip
